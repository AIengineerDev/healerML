name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # SECURITY: pull_request_target runs with a write-capable token in the
      # context of the base repo, on PRs from forks. Never add a checkout step
      # or execute contributor code in this workflow. This single step only.
      - uses: contributor-assistant/github-action@v2.6.1
        if: >
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request && (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/v1/cla.json'
          path-to-document: 'https://github.com/AIengineerDev/healerML/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'AIengineerDev,dependabot[bot],*[bot]'
          custom-notsigned-prcomment: >
            Thanks for the contribution. Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/AIengineerDev/healerML/blob/main/CLA.md)
            and sign it by posting the exact comment below. You only need to do
            this once, for all future contributions to this project.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
